[project]
name = "mimicord"
version = "0.1.0"
description = "Build Discord bots that talk like a real person, compiled from their chat history"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aljaz Golob" }]
dependencies = [
    "discord.py>=2.4",
    "anthropic>=0.100",
    "openai>=1.60",
    "chromadb>=1.0",
    "typer>=0.15",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.2.128",
]

[dependency-groups]
dev = ["pytest>=8.0", "pillow>=10.0"]

[project.scripts]
mimicord = "mimicord.cli:app"

[project.optional-dependencies]
gui = [
    "pyside6>=6.7",
]
vision = [
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimicord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
